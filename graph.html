<!doctype html>
<!--
  graph.html — the stable viewer shell for RFG2. NOT generated; keep and edit it
  freely (colors, controls, layout). The graph data lives in data.js, which
  viz.ts regenerates on each run. Reload this page after a run to see the update.

  v2 twist: edges are UNLABELED (direction only). Meaning shows through node
  color, by role — value / function / application. The legend names the three.
-->
<html>
<head>
  <meta charset="utf-8" />
  <title>RFG2 graph</title>
  <script src="https://unpkg.com/vis-network@9/standalone/umd/vis-network.min.js"></script>
  <script src="data.js"></script> <!-- generated by viz.ts; sets window.GRAPH -->
  <style>
    html, body { margin: 0; height: 100%; background: #111; font: 13px sans-serif; }
    #net { width: 100%; height: 100%; }
    #empty { color: #888; padding: 1rem; }
    #legend {
      position: fixed; top: 12px; left: 12px; color: #ddd;
      background: rgba(0,0,0,.55); padding: 10px 12px; border-radius: 8px;
      line-height: 1.9;
    }
    #legend .row { display: flex; align-items: center; gap: 8px; }
    #legend .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  </style>
</head>
<body>
  <div id="net"></div>
  <div id="legend">
    <div class="row"><span class="dot" style="background:#2b6cb0"></span>value — a datum</div>
    <div class="row"><span class="dot" style="background:#805ad5"></span>function — <code>fn()</code></div>
    <div class="row"><span class="dot" style="background:#dd6b20"></span>application — one call</div>
    <div class="row" style="margin-top:6px; color:#999">arrows pan · <code>]</code> zoom in · <code>[</code> zoom out</div>
  </div>
  <div id="empty" style="display:none">
    No data.js found. Build a graph and call renderData(g), then reload.
  </div>
  <script>
    const COLORS = { value: "#2b6cb0", function: "#805ad5", application: "#dd6b20" };
    const SHAPES = { value: "box", function: "box", application: "ellipse" };
    const DIM = "#2a2a2a", DIM_FONT = "#555", DIM_EDGE = "#333", HOT_EDGE = "#fff";

    const data = window.GRAPH;
    if (!data) {
      document.getElementById("empty").style.display = "block";
    } else {
      // remember each node's base color/role so we can dim and restore it.
      const base = new Map(data.nodes.map(n => [n.id, COLORS[n.role] || COLORS.value]));
      const nodes = new vis.DataSet(data.nodes.map(n => ({
        id: n.id,
        label: n.label,
        color: base.get(n.id),
        shape: SHAPES[n.role] || "box",
      })));
      const edges = new vis.DataSet(data.edges.map((e, i) => ({ id: i, ...e })));
      const network = new vis.Network(document.getElementById("net"), { nodes, edges }, {
        nodes: { font: { color: "#fff" } },
        edges: { arrows: "to", color: "#888" }, // unlabeled: direction only
        physics: { barnesHut: { springLength: 130 } }, // "push apart and settle"
        interaction: {
          // scroll wheel off; drive zoom/pan from the KEYBOARD instead.
          //   arrows -> pan,  [ -> zoom out,  ] -> zoom in
          zoomView: false,
          keyboard: { enabled: true, bindToWindow: true, speed: { x: 12, y: 12, zoom: 0.04 } },
        },
      });
      network.fit(); // frame the whole graph on load, since wheel-zoom is off

      // ---- click a node -> highlight it + its neighbors, dim everything else ----

      function restore() {
        nodes.update(data.nodes.map(n => ({
          id: n.id, color: base.get(n.id), font: { color: "#fff" }, borderWidth: 1,
        })));
        edges.update(edges.getIds().map(id => ({ id, color: "#888" })));
      }

      function highlight(id) {
        const keep = new Set([id, ...network.getConnectedNodes(id)]); // node + neighbors
        const hotEdges = new Set(network.getConnectedEdges(id));
        nodes.update(data.nodes.map(n => keep.has(n.id)
          ? { id: n.id, color: base.get(n.id), font: { color: "#fff" },
              borderWidth: n.id === id ? 4 : 1 } // clicked node gets a thick border
          : { id: n.id, color: DIM, font: { color: DIM_FONT }, borderWidth: 1 }));
        edges.update(edges.getIds().map(eid => ({
          id: eid, color: hotEdges.has(eid) ? HOT_EDGE : DIM_EDGE,
        })));
      }

      network.on("click", params => {
        if (params.nodes.length) highlight(params.nodes[0]); // clicked a node
        else restore();                                      // clicked empty space
      });
    }
  </script>
</body>
</html>
